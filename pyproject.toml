[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "sentry-companion-mcp"
dynamic = ["version"]
description = "Companion MCP server for Sentry — release health, adoption metrics, and tools missing from the official Sentry MCP"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "responses>=0.25.0",
]

[project.scripts]
sentry-companion-mcp = "sentry_companion_mcp.server:main"

[tool.hatch.version]
source = "vcs"
tag-pattern = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"

[tool.hatch.build.targets.wheel]
packages = ["src/sentry_companion_mcp"]
